<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SwingTrader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a ledger-like trading notebook - one top bar of tabs, cards of tables below, figures in a mono face. */
:root {
  --bg: #f4f5f2; --panel: #ffffff; --fg: #1b1f1d; --muted: #5d6662; --line: #dde1dc; --soft: #eef0ec;
  --accent: #1f5e7a; --accent-soft: #e3eef3;
  --up: #11734a; --down: #b3261e; --warn: #8a5a00; --warn-soft: #fbf1dc; --bad-soft: #fbe7e5; --good-soft: #e2f3ea;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1312; --panel: #161b1a; --fg: #e5e9e6; --muted: #98a39e; --line: #27302d; --soft: #1c2321;
  --accent: #6fb6d3; --accent-soft: #17303a;
  --up: #45c98a; --down: #ff7b72; --warn: #e3b341; --warn-soft: #2e2614; --bad-soft: #3a1d1b; --good-soft: #15301f;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1312; --panel: #161b1a; --fg: #e5e9e6; --muted: #98a39e; --line: #27302d; --soft: #1c2321;
  --accent: #6fb6d3; --accent-soft: #17303a;
  --up: #45c98a; --down: #ff7b72; --warn: #e3b341; --warn-soft: #2e2614; --bad-soft: #3a1d1b; --good-soft: #15301f;
  color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel) }
a { color: var(--accent) }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.bar-in { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; padding-block: 8px }
.brand { font-weight: 600; letter-spacing: .01em; display: flex; align-items: baseline; gap: 6px }
.brand small { color: var(--muted); font-weight: 400; font-size: 12px }
nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; max-width: 100% }
nav a { text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 7px; white-space: nowrap; font-weight: 500 }
nav a[aria-current="page"] { color: var(--fg); background: var(--soft) }
nav a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.status { margin-left: auto; font-size: 12px; color: var(--muted) }
main { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px }
h1 { font-size: 20px; margin: 0; font-weight: 600; text-wrap: balance }
h2 { font-size: 15px; margin: 0 0 8px; font-weight: 600 }
.sub { color: var(--muted); font-size: 13px; max-width: 75ch }
.muted { color: var(--muted) }
.small { font-size: 12.5px }
.stack { display: flex; flex-direction: column; gap: 14px }
.grid { display: grid; gap: 14px }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)) }
@media (max-width: 520px) { .kpis { grid-template-columns: 1fr 1fr } .kpi .value { font-size: 18px }
  nav a { padding: 6px 7px; font-size: 13.5px } .status { margin-left: 0 } }
.two { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr) }
@media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr) } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0 }
.kpi .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.kpi .value { font-family: var(--font-num); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; margin-top: 2px }
.kpi .note { font-size: 12px; color: var(--muted) }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px }
.up { color: var(--up) } .down { color: var(--down) }
.num { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch }
table { border-collapse: collapse; width: 100% }
th { text-align: left; font-weight: 500; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap }
th.num { text-align: right }
td { padding: 6px 8px; border-bottom: 1px solid var(--soft); vertical-align: top }
tr:last-child td { border-bottom: 0 }
tr.held td { background: var(--accent-soft) }
tr.flag td { background: var(--bad-soft) }
.sym { font-weight: 600; text-decoration: none }
.sym:hover { text-decoration: underline }
button.sym { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--accent); cursor: pointer }
.chip { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); background: var(--soft); color: var(--fg); white-space: nowrap; margin: 1px 2px 1px 0 }
.chip.buy, .chip.good { background: var(--good-soft); border-color: transparent; color: var(--up) }
.chip.sell, .chip.bad, .chip.danger { background: var(--bad-soft); border-color: transparent; color: var(--down) }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn) }
.chip.held { background: var(--accent-soft); border-color: transparent; color: var(--accent) }
.risk .chip { display: block; white-space: normal; margin-bottom: 3px; width: fit-content; max-width: 22rem }
.alert { border-radius: var(--r); padding: 10px 12px; font-size: 13px; border: 1px solid transparent }
.alert.bad { background: var(--bad-soft); color: var(--fg); border-color: color-mix(in srgb, var(--down) 30%, transparent) }
.alert.info { background: var(--soft); border-color: var(--line) }
.alert.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent) }
.chart { position: relative; height: 300px }
.chart.tall { height: 340px }
input[type="search"] { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg); width: 220px; max-width: 100% }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); align-items: center }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 6px 0 }
ul.how { margin: 0; padding-left: 18px; font-size: 13px; display: flex; flex-direction: column; gap: 4px }
.runs button { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; color: var(--fg); font: inherit; cursor: pointer; text-align: left; width: 100% }
.runs button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft) }
.empty { padding: 22px; text-align: center; color: var(--muted) }
.hide-sm { } @media (max-width: 700px) { .hide-sm { display: none } }
.mono { font-family: var(--font-num) }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important } }
</style>

<header class="bar"><div class="bar-in">
  <div class="brand">SwingTrader <small>paper portfolio · NSE</small></div>
  <nav id="tabs" aria-label="Pages">
    <a href="#today">Today</a><a href="#stocks">Stocks</a><a href="#portfolio">Portfolio</a><a href="#experiments">Experiments</a><a href="#research">Research</a>
  </nav>
  <div class="status" id="status">Loading…</div>
</div></header>
<main id="main" tabindex="-1"><div class="empty">Loading the latest evening update…</div></main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------- helpers
const $main = document.getElementById("main");
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k));
  return el;
}
const fmt = (v, d) => Math.abs(v).toLocaleString("en-IN", {minimumFractionDigits: d, maximumFractionDigits: d});
function inr(v, d = 0, sign = false) {
  if (v == null || !isFinite(v)) return "–";
  const r = +(+v).toFixed(d);
  return (r < 0 ? "-" : (sign && r > 0 ? "+" : "")) + "₹" + fmt(r, d);
}
function pct(v, d = 1, sign = true) {
  if (v == null || !isFinite(v)) return "–";
  const r = +(+v).toFixed(d);
  return (sign && r > 0 ? "+" : r < 0 ? "-" : "") + Math.abs(r).toFixed(d) + "%";
}
// colour only changes (moves, gains), never levels (price, value); judged at the digits shown
const tone = (v, d = 1) => v == null || !isFinite(v) ? "" : (+(+v).toFixed(d) > 0 ? "up" : +(+v).toFixed(d) < 0 ? "down" : "");
const num = (v, d = 2) => v == null || !isFinite(v) ? "–" : (+v).toFixed(d);
const day = s => {
  if (!s) return "–";
  const d = new Date(String(s).slice(0, 10) + "T00:00:00");
  return isNaN(d) ? String(s) : d.toLocaleDateString("en-IN", {day: "numeric", month: "short", year: "numeric"});
};
const td = (v, cls) => h("td", {class: cls}, v);
const card = (...kids) => h("section", {class: "card"}, kids);
const empty = text => h("div", {class: "empty"}, text);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---------------------------------------------------------------- data
const cache = {};
async function load(name) {
  if (!cache[name]) cache[name] = fetch(`data/view/${name}.json`, {cache: "no-store"}).then(r => {
    if (!r.ok) throw new Error(`${name}: ${r.status}`);
    return r.json();
  });
  return cache[name];
}
let details = null;
const slug = s => "stock-" + s.replace(/[^A-Za-z0-9]/g, c => "-" + c.charCodeAt(0).toString(16));
const unslug = s => s.slice(6).replace(/-([0-9a-f]{2})/g, (_, x) => String.fromCharCode(parseInt(x, 16)));
function symLink(s) {
  return details && details[s] ? h("a", {class: "sym", href: "#" + slug(s)}, s) : h("span", {class: "sym"}, s);
}

// ---------------------------------------------------------------- charts
let charts = [];
function lineChart(canvas, labels, sets, {log = false} = {}) {
  if (!window.Chart) { canvas.replaceWith(h("p", {class: "muted small"}, "The chart library did not load.")); return; }
  const fg = css("--muted"), grid = css("--line");
  charts.push(new Chart(canvas, {
    type: "line",
    data: {labels, datasets: sets.map(s => ({pointRadius: 0, borderWidth: 2, spanGaps: true, tension: 0, ...s}))},
    options: {maintainAspectRatio: false, animation: false, interaction: {mode: "index", intersect: false},
      plugins: {legend: {labels: {color: fg, boxWidth: 12, font: {family: css("--font-body")}}},
                tooltip: {callbacks: {label: c => `${c.dataset.label}: ${c.parsed.y == null ? "–" : c.parsed.y.toFixed(1)}`}}},
      scales: {x: {ticks: {color: fg, maxTicksLimit: 8, maxRotation: 0}, grid: {color: grid}},
               y: {type: log ? "logarithmic" : "linear", ticks: {color: fg}, grid: {color: grid}}}}
  }));
}
const norm = (rows, k) => { const b = (rows.find(r => r[k]) || {})[k]; return rows.map(r => r[k] && b ? r[k] / b * 100 : null); };

// ---------------------------------------------------------------- Today
async function today() {
  const d = await load("today");
  const b = d.book;
  if (!b) return [card(h("h2", {}, "The paper portfolio has not started yet"),
    h("p", {class: "muted"}, "It starts on the first evening update after NSE's daily file is in."))];
  const last = d.last;
  const out = [];
  out.push(h("div", {class: "kpis"},
    h("div", {class: "card kpi"}, h("div", {class: "label"}, "Portfolio value"),
      h("div", {class: "value"}, inr(last ? last.value : b.capital)),
      last && h("div", {class: "note"}, `at the close of ${day(last.date)}`),
      h("div", {class: "note"}, `started ${day(b.started_on)} with ${inr(b.capital)}`)),
    h("div", {class: "card kpi"}, h("div", {class: "label"}, "Since start"),
      h("div", {class: "value " + tone(d.return_pct)}, pct(d.return_pct)),
      h("div", {class: "note"}, "NIFTY 50 ", h("span", {class: tone(d.nifty_pct)}, pct(d.nifty_pct)),
        " · all screened ", h("span", {class: tone(d.all_screened_pct)}, pct(d.all_screened_pct)))),
    h("div", {class: "card kpi"}, h("div", {class: "label"}, "Holdings"),
      h("div", {class: "value"}, `${last ? last.holdings : 0} of ${b.rules.holdings}`),
      h("div", {class: "note"}, `cash ${inr(last ? last.cash : b.capital)}`)),
    h("div", {class: "card kpi"}, h("div", {class: "label"}, "Next decision"),
      h("div", {class: "value"}, day(d.next_decision)),
      h("div", {class: "note"}, `after the close; trades at the open on ${day(d.next_trades)}`))));
  const chartBox = h("div", {class: "chart"}, h("canvas", {"aria-label": "Portfolio, NIFTY 50 and all screened stocks since the start"}));
  const pending = d.pending;
  out.push(h("div", {class: "grid two"},
    card(h("h2", {}, `Value since start (each = 100 on ${day(b.started_on)})`),
      d.values.length > 1 ? chartBox : h("p", {class: "muted"}, "The chart appears after the second evening.")),
    h("div", {class: "stack"},
      card(h("h2", {}, "Waiting for the next open"),
        pending ? [h("p", {class: "small muted"}, `Decided at the close on ${day(pending.decided_on)}.`),
          h("div", {}, h("span", {class: "chip sell"}, "Sell"), " ", pending.sells.length ? pending.sells.map(s => [symLink(s), " "]) : h("span", {class: "muted"}, "nothing")),
          h("div", {style: "margin-top:6px"}, h("span", {class: "chip buy"}, "Buy"), " ", pending.buys.length ? pending.buys.map(s => [symLink(s), " "]) : h("span", {class: "muted"}, "nothing")),
          h("p", {class: "small muted"}, `Buys go in equal parts of the portfolio, best first, until ${b.rules.holdings} are held.`)]
          : h("p", {class: "muted"}, "Nothing. The book holds its stocks until the next month-end decision."),
        d.orders.length ? [h("h2", {style: "margin-top:10px"}, "Sell orders"),
          d.orders.map(o => h("div", {class: "small"}, `${o.symbol} at the official ${o.at} on ${day(o.day)} (${o.why})`))] : null),
      card(h("h2", {}, "How it works"), h("ul", {class: "how"},
        h("li", {}, "Every weekday evening NSE's official file updates prices and the list of tradeable stocks (the screen)."),
        h("li", {}, b.rules.lookback === "nse"
          ? "On the last trading day of each month the stocks are ranked the NSE way: the 6- and 12-month rise divided by how much the stock swings, so a steady riser beats a jumpy one."
          : "On the last trading day of each month the stocks are ranked by their 6-month rise."),
        h("li", {}, `At the next open: sell holdings that fell below rank ${b.rules.keep_rank}, buy the best ranked until ${b.rules.holdings} are held. The trades are made at NSE's official opening price and recorded by that evening's update.`),
        b.rules.stop_loss ? h("li", {}, `Between decisions, a holding that closes ${Math.round(b.rules.stop_loss * 100)}% or more below its buy price is sold at the next open, and a red-flag company announcement (auditor resigning, default, fraud, regulator action, ...) sells it too.`) : null,
        b.rules.sector_cap ? h("li", {}, `At most ${b.rules.sector_cap} stocks from one sector.`) : null,
        h("li", {}, "Tested 2010–2026 after all charges: see ", h("a", {href: "#research"}, "Research"), "."))))));
  const names = {daily_data: "Data", paper_book: "Portfolio", experiments: "Experiments", morning_fill: "Morning fill", stop_live: "Stop", backtest: "Backtest"};
  out.push(card(h("h2", {}, "Last updates"), h("div", {class: "scroll"}, h("table", {class: "small"},
    h("thead", {}, h("tr", {}, h("th", {}, "Finished"), h("th", {}, "Job"), h("th", {}, "For"), h("th", {}, "Result"))),
    h("tbody", {}, d.last_jobs.length ? d.last_jobs.map(j => h("tr", {},
      td(j.finished_at, "muted mono"), td(names[j.job] || j.job), td(j.detail.day || j.detail.for || ""),
      td([h("span", {class: "chip " + (["ok", "closed"].includes(j.status) ? "good" : ["backup", "incomplete"].includes(j.status) ? "warn" : "bad")}, j.status),
          j.detail.error ? h("span", {class: "small muted"}, " " + String(j.detail.error).slice(0, 120)) : null])))
      : h("tr", {}, td("No updates yet.", "muted")))))));
  return [out, () => {
    if (d.values.length > 1) lineChart(chartBox.firstChild, d.values.map(r => r.date), [
      {label: "Portfolio", data: norm(d.values, "value"), borderColor: css("--up")},
      {label: "NIFTY 50", data: norm(d.values, "nifty"), borderColor: css("--accent"), borderWidth: 1.5},
      {label: "All screened", data: norm(d.values, "all_screened"), borderColor: css("--muted"), borderWidth: 1, borderDash: [4, 3]}]);
  }];
}

// ---------------------------------------------------------------- Stocks
async function stocks() {
  const d = await load("stocks");
  const r = d.rules || {};
  const rows = d.rows || [];
  const zone = x => x.held && x.status === "below keep zone" ? h("span", {class: "chip sell"}, "sell")
    : x.status === "sector full" ? h("span", {class: "chip warn", title: `the portfolio already holds ${r.sector_cap} stocks from this sector`}, "sector full")
    : x.status === "buy zone" ? h("span", {class: "chip buy"}, "buy zone")
    : x.status === "keep zone" ? h("span", {class: "chip"}, "keep zone") : "";
  const body = h("tbody", {}, rows.length ? rows.map(x => {
    const tr = h("tr", {class: x.held ? "held" : null, "data-q": `${x.symbol} ${x.name || ""}`.toLowerCase()},
      td(x.rank || "–", "num"),
      td([symLink(x.symbol), " ", h("span", {class: "small muted hide-sm"}, x.name || "")]),
      td(inr(x.close, 2), "num"),
      r.lookback === "nse" ? td(x.score == null ? "–" : num(x.score), "num") : null,
      td(pct(x.ret_6m), "num " + tone(x.ret_6m)),
      td(pct(x.ret_1m), "num hide-sm " + tone(x.ret_1m)),
      td(x.sector || "", "small muted hide-sm"),
      td([zone(x), x.held && !x.on_screen ? h("span", {class: "small muted"}, " off the screen") : null]),
      td(x.held ? h("span", {class: "chip held"}, "held") : ""));
    tr.hidden = !!(x.rank && x.rank > 100 && !x.held);
    tr.dataset.tail = tr.hidden ? "1" : "";
    return tr;
  }) : h("tr", {}, h("td", {colspan: 9, class: "muted"}, "No screen yet: it is made by the evening update.")));
  const search = h("input", {type: "search", id: "find", placeholder: "Find a stock…", "aria-label": "Find a stock",
    oninput: e => { const v = e.target.value.trim().toLowerCase();
      body.querySelectorAll("tr[data-q]").forEach(tr => tr.hidden = v ? !tr.dataset.q.includes(v) : tr.dataset.tail === "1"); }});
  return [[
    h("div", {class: "head"}, h("div", {},
      h("h1", {}, "Strongest stocks"),
      h("p", {class: "sub"}, `${d.screened} stocks pass the screen on ${day(d.day)} (liquid, price ≥ ₹20, steady trading, listed a year), ranked `,
        r.lookback === "nse" ? "by the NSE-style score: the 6- and 12-month rise divided by how much the stock swings, compared with every screened stock (0 = average, 2 = far above). " : "by their 6-month rise. ",
        "This is the ranking the monthly decision uses; the 1-month column is for information only.")), search),
    h("div", {class: "legend"},
      h("span", {}, h("span", {class: "chip buy"}, "buy zone"), ` top ${r.holdings}: bought at a month end when a place is free`),
      h("span", {}, h("span", {class: "chip"}, "keep zone"), ` to rank ${r.keep_rank}: a holding here is kept`),
      h("span", {}, h("span", {class: "chip sell"}, "sell"), ` a holding below rank ${r.keep_rank} is sold at the next month end`),
      r.sector_cap ? h("span", {}, h("span", {class: "chip warn"}, "sector full"), ` at most ${r.sector_cap} holdings per sector`) : null),
    card(h("div", {class: "scroll"}, h("table", {},
      h("thead", {}, h("tr", {}, h("th", {class: "num"}, "Rank"), h("th", {}, "Stock"), h("th", {class: "num"}, "Close"),
        r.lookback === "nse" ? h("th", {class: "num"}, "Score") : null, h("th", {class: "num"}, "6 months"),
        h("th", {class: "num hide-sm"}, "1 month"), h("th", {class: "hide-sm"}, "Sector"), h("th", {}, "Zone"), h("th", {}, h("span", {class: "muted"}, "")))),
      body))),
    h("p", {class: "small muted"}, "Showing the top 100 and every holding; type in the box to find any screened stock. Tap a stock for its chart and news.")]];
}

// ---------------------------------------------------------------- Portfolio
async function portfolio() {
  const P = await load("portfolio");

      card(h("h2", {}, "Portfolio trades"), h("div", {class: "scroll"}, h("table", {class: "small"},
        h("thead", {}, h("tr", {}, h("th", {}, "Date"), h("th", {}, "Side"), ["Shares", "Price", "Amount"].map(x => h("th", {class: "num"}, x)))),
        h("tbody", {}, d.fills.length ? d.fills.map(f => h("tr", {}, td(day(f.date)), td(h("span", {class: "chip " + (f.side === "BUY" ? "buy" : "sell")}, f.side)),
          td(num(f.shares), "num"), td(inr(f.price, 2), "num"), td(inr(f.value), "num"))) : h("tr", {}, td("None.", "muted")))))),
      card(h("h2", {}, "Corporate actions (NSE)"), h("div", {class: "scroll"}, h("table", {class: "small"}, h("tbody", {},
        d.actions.length ? d.actions.map(a => h("tr", {}, td(day(a.ex_date)), td(a.kind), td(a.subject || "", "muted"))) : h("tr", {}, td("None recorded.", "muted")))))))];
  return [out, () => {
    if (d.series.length > 1) lineChart(box.firstChild, d.series.map(x => x.date), [
      {label: symbol, data: norm(d.series, "close"), borderColor: css("--up")},
      {label: "NIFTY 50", data: norm(d.series, "nifty"), borderColor: css("--accent"), borderWidth: 1.5}], {log: true});
  }];
}

// ---------------------------------------------------------------- router
const PAGES = {today, stocks, portfolio, experiments, research};
let seq = 0;
async function route() {
  const my = ++seq;
  let name = (location.hash || "#today").slice(1);
  const isStock = name.startsWith("stock-");
  if (!isStock && !PAGES[name]) name = "today";
  document.querySelectorAll("#tabs a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + (isStock ? "stocks" : name) ? "page" : "false"));
  try {
    if (!details) details = await load("stocks_detail").catch(() => ({}));
    const [nodes, after] = isStock ? await stock(unslug(name)) : await PAGES[name]();
    if (my !== seq) return;
    charts.forEach(c => c.destroy()); charts = [];
    $main.replaceChildren(h("div", {class: "stack"}, nodes));
    if (after) after();
  } catch (e) {
    if (my !== seq) return;
    $main.replaceChildren(h("div", {class: "alert bad"}, "This page's data could not be read: ", String(e.message || e),
      ". The evening update may not have run yet."));
  }
}
async function status() {
  try {
    const s = await load("status");
    const bad = (s.log || []).some(l => /status: error/.test(l));
    document.getElementById("status").replaceChildren(...[
      bad ? h("span", {class: "chip bad"}, "last update failed") : null, bad ? " " : null,
      `Prices to ${day(s.prices_to)} · updated ${s.ran_at} IST`].filter(x => x != null));
  } catch { document.getElementById("status").textContent = "Not updated yet"; }
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
status();
route();
</script>
